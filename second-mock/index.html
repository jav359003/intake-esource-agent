<!doctype html>
<meta charset="utf-8">
<title>Veridian EDC — ABC-101</title>
<style>
  body{margin:0;font:14px/1.5 "Segoe UI",system-ui,sans-serif;background:#f4f6f8;color:#1c2530}
  .vx-top{display:flex;align-items:center;gap:22px;background:#123a5e;color:#fff;padding:10px 18px}
  .vx-mark{font-weight:700;letter-spacing:.02em}
  .vx-top nav{display:flex;gap:6px}
  .vx-mod{padding:5px 12px;border-radius:4px;cursor:pointer}
  .vx-mod.vx-on{background:#1d5285}
  .vx-study{margin-left:auto;opacity:.85}
  .vx-pane{padding:18px 22px}
  h2{font-size:17px;margin:0 0 12px}
  h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:#5b6b7c;margin:0 0 10px}
  .vx-crumb{display:flex;align-items:center;gap:14px;margin-bottom:14px}
  .vx-actions{display:flex;gap:8px;margin-left:auto}
  [role=grid]{background:#fff;border:1px solid #d7dee6;border-radius:5px}
  .vx-row{display:grid;grid-template-columns:2fr 1fr 1fr auto auto;gap:14px;padding:9px 12px;border-bottom:1px solid #eef2f5;align-items:center}
  .vx-empty{padding:14px;color:#7b8794;font-style:italic}
  .vx-tap{display:inline-block;padding:6px 13px;border:1px solid #b9c4cf;border-radius:4px;background:#fff;cursor:pointer;user-select:none}
  .vx-primary{background:#1d5285;border-color:#1d5285;color:#fff}
  .vx-link{color:#1d5285;cursor:pointer;text-decoration:underline}
  .vx-card{background:#fff;border:1px solid #d7dee6;border-radius:5px;padding:14px;margin-top:14px;max-width:430px}
  .vx-field{display:flex;flex-direction:column;gap:3px;margin-bottom:9px}
  .vx-field label{font-size:12px;color:#5b6b7c}
  input[type=text],select,textarea{padding:5px 7px;border:1px solid #b9c4cf;border-radius:3px;font:inherit}
  .vx-three{display:grid;grid-template-columns:290px minmax(0,1fr) 230px;gap:16px;align-items:start}
  .vx-props,.vx-palette{background:#fff;border:1px solid #d7dee6;border-radius:5px;padding:13px}
  .vx-canvas{background:#fff;border:1px solid #d7dee6;border-radius:5px;padding:13px;min-height:330px}
  .vx-el{border:1px solid #e3e9ef;border-radius:4px;padding:8px 10px;margin-bottom:7px;cursor:pointer}
  .vx-el.vx-sel{border-color:#1d5285;box-shadow:0 0 0 2px #1d528522}
  .vx-el-name{display:block;font-size:12px;color:#5b6b7c;margin-bottom:4px}
  .vx-kind{display:block;margin-bottom:5px;text-align:left}
  .vx-choice{border-top:1px dashed #e3e9ef;padding-top:7px;margin-top:7px}
  .vx-muted{color:#7b8794;font-style:italic}
  .vx-state{font-size:12px;color:#5b6b7c;border:1px solid #d7dee6;border-radius:99px;padding:1px 9px}
</style>
<div id="root"></div>
<script src="app.js"></script>
